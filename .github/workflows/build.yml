name: Release & Build Agy Switch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Validate packaged OAuth client ID
        shell: bash
        env:
          AGY_BUNDLED_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.AGY_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          if [[ -z "${AGY_BUNDLED_GOOGLE_OAUTH_CLIENT_ID//[[:space:]]/}" ]]; then
            echo "::error::Missing AGY_GOOGLE_OAUTH_CLIENT_ID. Refusing to build an installer without its bundled OAuth client ID."
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGY_BUNDLED_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.AGY_GOOGLE_OAUTH_CLIENT_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'Agy Switch v__VERSION__'
          releaseBody: 'Automatic build release of Agy Switch for Windows & macOS.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
